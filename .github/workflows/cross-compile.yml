name: Cross Compile

# Cross-compiles the Rust/oo7 extension into precompiled, per-platform
# native gems and uploads them as build artifacts. This does NOT publish to
# RubyGems — releasing is a manual step you perform with the built gems.
#
# When users install a published precompiled gem, RubyGems serves the one
# matching their platform (the .so is already inside), so they need no Rust.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'oo7.gemspec'
      - 'Rakefile'
      - '.github/workflows/cross-compile.yml'
      # The loader and the version live here, and the version is what the platform gems are
      # built as, so a bump has to rebuild them.
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    name: Fetch the supported platforms and Ruby versions
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: true
          stable-ruby-versions: |
            exclude: [head]

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
        exclude:
          # Applies to any gem built from this repository: x64-mingw32 is the
          # legacy Windows toolchain used only by Ruby <= 3.0. We require
          # >= 3.3, which uses x64-mingw-ucrt, so rake-compiler never registers
          # a native:x64-mingw32 task and the job would always fail.
          - platform: x64-mingw32

          # --- oo7-specific; delete these two lines in a gem that is not this
          # one, and Windows builds come back ------------------------------
          #
          # The Secret Service is a freedesktop D-Bus API, so there is nothing
          # on Windows for *this* gem to bind. oo7 pulls in ashpd to ask
          # whether the process is sandboxed, and ashpd is Unix-only --
          # `std::os::unix`, `std::os::fd` and `zbus::zvariant::Fd` do not
          # exist there, so the dependency fails to compile before any crate of
          # ours is reached:
          #
          #   error[E0433]: cannot find `unix` in `os`
          #   error[E0432]: unresolved import `std::os::fd`
          #   error: could not compile `ashpd` (lib) due to 4 previous errors
          #
          # Nothing in the toolchain is at fault, so there is nothing to fix
          # here -- only a platform to stop asking for.
          - platform: x64-mingw-ucrt
          - platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error
